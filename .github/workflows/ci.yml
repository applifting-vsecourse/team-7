name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://quacker:quacker@localhost:5433/quacker
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quacker
          POSTGRES_PASSWORD: quacker
          POSTGRES_DB: quacker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quacker -d quacker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm ts

      - name: Test
        run: pnpm test

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build

      - name: Prepare end-to-end database
        run: |
          pnpm backend migrate
          pnpm backend seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report and test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
